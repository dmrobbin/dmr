{% load weiss_lists %}{# A card's picture in its rarity's frame: R and up glow, SR and up shine (see "Rarity effects" in site.css). Expects `card`; optional img_class, alt, lazy. #}{% with grade=card|rarity_grade %}<span class="rfx"{% if grade %} data-grade="{{ grade }}"{% endif %}><img{% if img_class %} class="{{ img_class }}"{% endif %} src="{{ card.image_src }}" alt="{{ alt }}"{% if lazy %} loading="lazy"{% endif %}>{% if grade >= 3 %}<span class="rfx-sheen" aria-hidden="true"></span>{% endif %}</span>{% endwith %}
