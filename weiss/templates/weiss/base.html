{% extends "core/dashboard_base.html" %}
{% load static %}

{% block content %}
  <div class="weiss-layout">
    <div class="weiss-main">{% block weiss_content %}{% endblock %}</div>
    <aside class="list-panel" aria-label="Card lists" data-list-panel>
      {% include "weiss/list_panel.html" %}
    </aside>
  </div>
  <dialog class="card-popup" data-card-popup-dialog aria-label="Card details">
    <form method="dialog"><button class="card-popup-close" aria-label="Close">×</button></form>
    <div data-card-popup-body></div>
  </dialog>
  <script src="{% static 'weiss/lists.js' %}" defer></script>
  {% block weiss_scripts %}{% endblock %}
{% endblock %}
