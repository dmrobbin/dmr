{# Contents of the deck-builder popup (loaded by lists.js into the dialog in weiss/base.html). Expects `card`. #}
<div class="card-popup-content">
  {% if card.image_src %}<img class="card-popup-image" src="{{ card.image_src }}" alt="{{ card.name }}">{% endif %}
  <div>
    {% include "weiss/card_summary.html" %}
    <div class="card-popup-actions">
      {% include "weiss/qty_controls.html" %}
      <a class="small" href="{% url 'weiss:card' card.pk %}">Full card page →</a>
    </div>
  </div>
</div>
