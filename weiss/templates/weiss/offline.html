<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e0f12">
  <title>Offline · Weiss</title>
  {# Served from the service worker's cache with nothing else to hand, so everything it needs is inline. #}
  <style>
    :root { color-scheme: dark; --bg: #0e0f12; --surface: #16181d; --text: #ece8e1; --muted: #9a958d; --border: #2a2d34;
            --accent: #d4af37; --on-accent: #14120e; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { color-scheme: light; --bg: #f6f3ec; --surface: #fffdf8; --text: #1d1b17; --muted: #5f5a51;
                                       --border: #d9d3c6; --accent: #8a6a12; --on-accent: #fffdf8; }
    }
    :root[data-theme="light"] { color-scheme: light; --bg: #f6f3ec; --surface: #fffdf8; --text: #1d1b17; --muted: #5f5a51;
                                --border: #d9d3c6; --accent: #8a6a12; --on-accent: #fffdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; text-align: center; background: var(--surface); border: 1px solid var(--border);
           border-radius: 14px; padding: 32px 24px; }
    .crest { width: 72px; height: 72px; margin: 0 auto 16px; display: block; }
    h1 { font: 600 1.5rem/1.2 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { font: inherit; font-weight: 600; min-height: 44px; padding: 10px 24px; border-radius: 999px; border: 0;
             background: var(--accent); color: var(--on-accent); cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
  <script>try { var t = localStorage.getItem("site-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <main>
    <svg class="crest" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3" opacity=".35"/>
      <path d="M17 22l6 22 9-16 9 16 6-22" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>You're offline</h1>
    <p>This page needs a connection. Your games and saves are kept on the server, so nothing's lost: try again once you're back online.</p>
    <button type="button" onclick="location.reload()" autofocus>Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
