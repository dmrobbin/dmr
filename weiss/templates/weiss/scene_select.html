{# A choice of scene for one moment of an arcade list (cpu_views.arcade_scenes). Expects field, chosen, and entry for a CPU's. #}<select name="{{ field }}{% if entry %}-{{ entry }}{% endif %}"><option value="">None</option>{% for scene in scenes %}<option value="{{ scene.pk }}"{% if scene.pk == chosen %} selected{% endif %}>{{ scene.name }}{% if scene.errors %} (has mistakes){% endif %}</option>{% endfor %}</select>
