{# A generic Weiss Schwarz booster pack: white over black with a gold band. Expects set_name; packs.js copies it for the opening. #}
<span class="ws-pack" aria-hidden="true">
  <span class="ws-pack-crimp"></span>
  <span class="ws-pack-body">
    <span class="ws-pack-count">{{ pack_size|default:8 }} cards</span>
    <span class="ws-pack-weiss">Weiss</span>
    <span class="ws-pack-kind">Booster pack</span>
    <span class="ws-pack-schwarz">Schwarz</span>
    <span class="ws-pack-set">{{ set_name }}</span>
    <span class="ws-pack-sheen"></span>
  </span>
  <span class="ws-pack-crimp"></span>
</span>
