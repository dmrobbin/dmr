<label class="small">Name <input type="text" name="name" value="{{ name }}" maxlength="100" required></label>
<label class="small">Model
  <select name="model">{% for value, label in models %}<option value="{{ value }}"{% if value == model %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
</label>
<label class="small">Aggression
  <select name="aggression">{% for value in aggressions %}<option value="{{ value }}"{% if value == aggression %} selected{% endif %}>{{ value }}</option>{% endfor %}</select>
</label>
<label class="small">Deck
  <select name="deck">
    <option value="">Choose a deck</option>
    {% for deck in decks %}<option value="{{ deck.pk }}"{% if deck.pk == deck_id %} selected{% endif %}>{{ deck.name }} ({{ deck.total|default:0 }})</option>{% endfor %}
  </select>
</label>
<label class="small cpu-text">Before the match <textarea name="intro_text" rows="2" maxlength="1000">{{ intro_text }}</textarea></label>
<label class="small cpu-text">When the player wins <textarea name="player_win_text" rows="2" maxlength="1000">{{ player_win_text }}</textarea></label>
<label class="small cpu-text">When the player loses <textarea name="player_lose_text" rows="2" maxlength="1000">{{ player_lose_text }}</textarea></label>
